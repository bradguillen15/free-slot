openapi: 3.0.3
info:
  title: FreeSlot API
  description: |
    FreeSlot uses Supabase client SDK for CRUD (PostgREST) and edge functions for AI workflows.
    CRUD tables are documented in docs/data-model.md and docs/CLOUD.md.
    This spec covers edge function contracts.
  version: 0.1.0

paths:
  /functions/v1/generate-weekly-plan:
    post:
      summary: Generate AI weekly plan
      description: Calls the Gemini API with gaps, activities, priorities, and capped daily notes; upserts weekly_plans. Structural arrays are size-capped (gaps 200, activities 100, priorities 100).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - week_start
              properties:
                week_start:
                  type: string
                  format: date
                gaps:
                  type: array
                  description: Free windows for the week
                activities:
                  type: array
                priorities:
                  type: array
                daily_notes:
                  type: array
                  description: Optional week notes as {date, text}; server caps at 14 notes / 500 chars each before prompting.
                  items:
                    type: object
                    properties:
                      date:
                        type: string
                        format: date
                      text:
                        type: string
                locale:
                  type: string
                  enum: [en, es]
                  description: UI language; AI-generated rationale/summary text is written in this language. Defaults to en when omitted or unsupported.
      responses:
        "200":
          description: Plan generated and stored
        "400":
          description: Missing week_start or payload exceeds size caps
        "401":
          description: Unauthorized

  /functions/v1/delete-account:
    post:
      summary: Delete user account
      description: Service-role cleanup and auth user deletion.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Account deleted
        "401":
          description: Unauthorized

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
