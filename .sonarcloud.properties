# SonarCloud Automatic Analysis configuration.
# (Supported keys are limited under Automatic Analysis — see SonarCloud docs.)

# i18n translation catalogs (en.ts/es.ts) share identical key/object structure
# by design — en/es parity is enforced at the type level (see docs/frontend-standards.md).
# SonarCloud's duplication detector tokenizes string literals generically, so the
# two catalogs register as "duplicated" even though every string value differs.
# This is a structural false positive, not a code smell — exclude from CPD only
# (other checks still run on these files).
sonar.cpd.exclusions=src/i18n/locales/**
