# SonarQube Cloud (sonarcloud.io) configuration.
# organization / projectKey are the keys SonarCloud generates when the repo is
# imported; confirm them in Project > Information and adjust if they differ.
sonar.organization=bradguillen15
sonar.projectKey=bradguillen15_free-slot

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx

# Generated code, third-party UI primitives, and type-only modules carry no
# meaningful quality signal, so keep them out of the analysis scope.
sonar.exclusions=\
  src/components/ui/**,\
  src/integrations/supabase/types.ts,\
  src/vite-env.d.ts,\
  **/*.d.ts

# Coverage gate: src/lib/** only (pure logic). UI layers have no lcov data and
# would read as 0%; test files inherit 0% from lcov too. Vitest may report a
# wider include set locally — that does not affect this gate.
sonar.coverage.exclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  src/test/**,\
  src/lib/schedule.ts,\
  src/components/**,\
  src/pages/**,\
  src/contexts/**,\
  src/hooks/**,\
  src/i18n/**,\
  src/resources/**,\
  src/App.tsx,\
  src/main.tsx

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.app.json
