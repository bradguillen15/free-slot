name: CI

# CI gates pull requests: lint, typecheck, unit tests, build, and the guest
# E2E suite all run on every PR, so a change can't merge unless they pass.
# It is also exposed as a reusable workflow (workflow_call) so the CD pipeline
# can re-run the exact same checks on main before deploying.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so SonarQube can attribute new-code and blame data.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cache the Playwright browser binaries, keyed by the resolved version
      # in the lockfile so the cache invalidates when @playwright/test updates.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify (lint, typecheck, unit tests, build, guest E2E)
        run: pnpm verify:ci
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: placeholder

      # Runs after verify so coverage/lcov.info exists and a scan hiccup can't
      # mask a real test failure. Skipped automatically on forks/Dependabot,
      # which have no access to the SONAR_TOKEN secret.
      - name: SonarQube scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_HOST_URL: https://sonarcloud.io

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
